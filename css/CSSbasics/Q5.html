<body>

    <h1>Choose Your Plan</h1>

    <div class="plans">

        <!-- Basic Plan -->
        <div class="plan">
            <h2>Basic</h2>

            <h3>₹299 / month</h3>

            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>


        <!-- Standard Plan -->
        <div class="plan popular">
            <h2>Standard</h2>

            <ul>
                <li>15 Projects</li>
                <li>50 GB Storage</li>

            </ul>

            <a href="#">Choose Plan</a>
        </div>


        <!-- Premium Plan -->

            <h2>Premium</h2>

            <h3>₹999 / month</h3>

            <ul>
                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

    </div>
