<!DOCTYPE html>
<html>

<head>
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="mountain.jpg" alt="Mountain">
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure>
            <img src="beach.jpg" alt="Beach">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure>
            <img src="forest.jpg" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="city.jpg" alt="City">
            <figcaption>City View</figcaption>
        </figure>

        <figure>
            <img src="lake.jpg" alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <img src="images.jpg" alt="Sunset">
            <figcaption>Beautiful Sunset</figcaption>
        </figure>

    </div>

</body>

</html>
