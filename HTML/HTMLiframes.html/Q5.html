<!DOCTYPE html>
<html>

<head>
    <title>Payment Form</title>
</head>

<body>

    <h1>Payment Form</h1>

    <!-- Payment Form -->

    <form>

        <!-- Cardholder Name -->
        <label>Cardholder Name:</label>

        <input
            type="text"
            name="cardholder"
            required>

        <br><br>


        <!-- Card Number -->
        <label>Card Number:</label>

        <input
            type="text"
            name="cardnumber"
            required>

        <br><br>


        <!-- Expiry Date -->
        <label>Expiry Date:</label>

        <input
            type="text"
            name="expiry"
            placeholder="MM/YY"
            required>

        <br><br>


        <!-- CVV -->
        <label>CVV:</label>

        <input
            type="password"
            name="cvv"
            required>

        <br><br>


        <!-- Pay Button -->
        <input
            type="submit"
            value="Pay Now">

    </form>

</body>

</html>
