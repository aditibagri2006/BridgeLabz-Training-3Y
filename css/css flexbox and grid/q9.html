<!DOCTYPE html>
<html>

<head>
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="q9.css">
</head>

<body>

    <div class="card-container">

        <div class="card">

            <!-- Front Side -->

            <div class="front">

                <img src="nature.jpg" alt="Nature">

                <h2>Beautiful Nature</h2>

            </div>


            <!-- Back Side -->

            <div class="back">

                <h2>About Nature</h2>

                <p>
                    Nature gives us beautiful landscapes,
                    fresh air and a peaceful environment.
                    We should protect and preserve it.
                </p>

            </div>

        </div>

    </div>

</body>

</html>
