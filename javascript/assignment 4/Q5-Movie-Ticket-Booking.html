<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; }
        input { display: block; width: 100%; padding: 9px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 18px; }
        #bookingOutput { white-space: pre-line; }
    </style>
</head>
<body>
    <h1>Movie Ticket Booking</h1>
    <form id="bookingForm">
        <label>Name <input id="customerName" type="text" required></label>
        <label>Email <input id="customerEmail" type="email" required></label>
        <label>Seats (1–10) <input id="seatCount" type="number" min="1" max="10" required></label>
        <button type="submit">Book Tickets</button>
    </form>
    <p id="bookingOutput"></p>
    <script src="Q5-Movie-Ticket-Booking.js"></script>
</body>
</html>
