<!DOCTYPE html>
<html>

<head>
    <title>HTML Entities</title>
</head>

<body>

    <h1>HTML Entities</h1>

    <!-- Demonstrating special characters using HTML entities -->

    <p>
        Less than: &lt;
    </p>

    <p>
        Greater than: &gt;
    </p>

    <p>
        Ampersand: &amp;
    </p>

    <p>
        Double quotation: &quot;
    </p>

    <p>
        Single quotation: &apos;
    </p>

    <p>
        Copyright: &copy;
    </p>

    <p>
        Trademark: &trade;
    </p>

    <p>
        Registered Trademark: &reg;
    </p>

</body>

</html>
