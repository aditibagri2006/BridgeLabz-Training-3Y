<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Validation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; }
        input { display: block; width: 100%; padding: 9px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 18px; }
    </style>
</head>
<body>
    <h1>Login Form</h1>
    <form id="loginForm">
        <label>Username <input id="username" type="text" required></label>
        <label>Password <input id="password" type="password" required></label>
        <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
    <script src="Q7-Login-Form-Validation.js"></script>
</body>
</html>
