<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Practice</title>
    <link rel="stylesheet" href="q4.css">
</head>

<body>

    <header>
        <h1>CSS Selectors Practice</h1>
    </header>

    <main>

        <section class="content">

            <p>This is an element selector.</p>

            <p class="special">
                This paragraph uses a class selector.
            </p>

            <p id="unique">
                This paragraph uses an ID selector.
            </p>

            <input type="text" placeholder="Attribute selector">

            <div class="parent">
                <p>Direct child paragraph</p>

                <div>
                    <p>Descendant paragraph</p>
                </div>
            </div>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>

            <p class="next">
                Paragraph after the list.
            </p>

            <p class="general">
                Another paragraph.
            </p>

            <a href="#">Visit Website</a>

        </section>

    </main>

    <footer>
        <p>CSS Selectors Practice Page</p>
    </footer>

</body>
</html>
