<!DOCTYPE html>
<html>

<head>
    <title>URI Encoding</title>
</head>

<body>

    <h1>URI Encoding</h1>

    <p>
        Original URL:
    </p>

    <p>
        https://example.com/search?query=HTML & CSS
    </p>


    <p>
        Encoded URL:
    </p>

    <!-- %20 represents a space -->

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML &amp; CSS
    </a>

</body>

</html>
