<!DOCTYPE html>
<html>

<head>
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="question6.css">
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="photo1.jpg" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="photo">
            <img src="photo2.jpg" alt="Mountain">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="photo3.jpg" alt="Beach">
            <div class="caption">Beautiful Beach</div>
        </div>

        <div class="photo">
            <img src="photo4.jpg" alt="City">
            <div class="caption">City Lights</div>
        </div>

        <div class="photo">
            <img src="photo5.jpg" alt="Sunset">
            <div class="caption">Sunset</div>
        </div>

        <div class="photo">
            <img src="photo6.jpg" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

    </div>

</body>

</html>
