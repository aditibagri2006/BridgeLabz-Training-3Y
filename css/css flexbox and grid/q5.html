<!DOCTYPE html>
<html>

<head>
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <h1>Choose Your Plan</h1>

    <div class="pricing">

        <!-- Basic Plan -->

        <div class="card">
            <h2>Basic</h2>

            <h3>₹199 / month</h3>

            <p>✔ 5 Projects</p>
            <p>✔ 10 GB Storage</p>
            <p>✔ Email Support</p>

            <button>Choose Plan</button>
        </div>


        <!-- Premium Plan -->

        <div class="card middle">
            <h2>Premium</h2>

            <h3>₹499 / month</h3>

            <p>✔ 20 Projects</p>
            <p>✔ 50 GB Storage</p>
            <p>✔ Priority Support</p>

            <button>Choose Plan</button>
        </div>


        <!-- Pro Plan -->

        <div class="card">
            <h2>Pro</h2>

            <h3>₹799 / month</h3>

            <p>✔ Unlimited Projects</p>
            <p>✔ 100 GB Storage</p>
            <p>✔ 24/7 Support</p>

            <button>Choose Plan</button>
        </div>

    </div>

</body>

</html>
