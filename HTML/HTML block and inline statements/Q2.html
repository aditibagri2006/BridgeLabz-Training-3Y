<!DOCTYPE html>
<html>

<head>
    <title>Product Catalog</title>
</head>

<body>

    <h1>Online Product Catalog</h1>

    <table border="1">

        <tr>
            <th>Product Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>Laptop</td>

            <td>
                <img src="laptop.jpg" alt="Laptop" width="100">
            </td>

            <td>Powerful laptop for students</td>

            <td>₹50,000</td>

            <td>Available</td>
        </tr>

        <tr>
            <td>Headphones</td>

            <td>
                <img src="headphones.jpg" alt="Headphones" width="100">
            </td>

            <td>Wireless headphones</td>

            <td>₹2,000</td>

            <td>Available</td>
        </tr>

        <tr>
            <td>Smart Watch</td>

            <td>
                <img src="watch.jpg" alt="Smart Watch" width="100">
            </td>

            <td>Smart watch with fitness tracking</td>

            <td>₹3,500</td>

            <td>Out of Stock</td>
        </tr>

        <!-- Example of colspan -->
        <tr>
            <td colspan="5">
                Free delivery available on orders above ₹1,000
            </td>
        </tr>

    </table>

</body>

</html>
