<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <link rel="stylesheet" href="q1.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter.</p>
    </header>

    <!-- Main Gallery -->
    <main>
        <section class="gallery">

            <figure class="image-card">
                <img class="blur" src="https://picsum.photos/400/300?random=1" alt="Nature">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure class="image-card">
                <img class="grayscale" src="https://picsum.photos/400/300?random=2" alt="Mountain">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure class="image-card">
                <img class="sepia" src="https://picsum.photos/400/300?random=3" alt="Forest">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure class="image-card">
                <img class="brightness" src="https://picsum.photos/400/300?random=4" alt="City">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure class="image-card">
                <img class="contrast" src="https://picsum.photos/400/300?random=5" alt="Beach">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure class="image-card">
                <img class="hue" src="https://picsum.photos/400/300?random=6" alt="Travel">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>Responsive Image Gallery</p>
    </footer>

</body>
</html>
