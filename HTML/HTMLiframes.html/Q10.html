<!DOCTYPE html>
<html>

<head>

    <!-- Title of the webpage -->
    <title>My Webpage</title>


    <!-- Character encoding -->
    <meta charset="UTF-8">


    <!-- Description of the webpage -->
    <meta
        name="description"
        content="This is my personal webpage.">


    <!-- Author of the webpage -->
    <meta
        name="author"
        content="Aditi Bagri">


    <!-- Base URL for relative links -->
    <base href="https://example.com/">


    <!-- Link to favicon -->
    <link
        rel="icon"
        href="favicon.ico">


    <!-- Style tag for CSS -->
    <!-- It is empty because this task uses HTML only -->
    <style>
    </style>


    <!-- Script tag for JavaScript -->
    <!-- It is empty because this task uses HTML only -->
    <script>
    </script>

</head>


<body>

    <h1>Important Head Elements</h1>

    <p>
        This webpage demonstrates important HTML elements
        used inside the head section.
    </p>

</body>

</html>
