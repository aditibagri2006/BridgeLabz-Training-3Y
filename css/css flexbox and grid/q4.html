<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="q4.css">
</head>

<body>

    <div class="dashboard">

        <!-- Header -->

        <header>
            <h1>My Dashboard</h1>
        </header>


        <!-- Sidebar -->

        <aside>

            <h2>Menu</h2>

            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>

        </aside>


        <!-- Main Content -->

        <div class="content">

            <div class="box box1">
                <h2>Sales</h2>
                <p>₹50,000</p>
            </div>

            <div class="box box2">
                <h2>Users</h2>
                <p>1,250</p>
            </div>

            <div class="box box3">
                <h2>Projects</h2>
                <p>25 Active Projects</p>
            </div>

            <div class="box box4">
                <h2>Orders</h2>
                <p>350 Orders</p>
            </div>

            <div class="box box5">
                <h2>Messages</h2>
                <p>48 New Messages</p>
            </div>

        </div>

    </div>

</body>

</html>
