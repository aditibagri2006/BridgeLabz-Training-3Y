<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="q9.css">
</head>

<body>

    <header>
        <h1>Combined CSS Effects</h1>
    </header>

    <main>
        <section class="effects">

            <div class="effect-card">
                <h2>Hover Effect</h2>
                <button>Hover Me</button>
                <p>Button grows and changes color.</p>
            </div>

            <div class="effect-card">
                <h2>Transform Effect</h2>
                <button>Move Me</button>
                <p>Button moves upward on hover.</p>
            </div>

            <div class="effect-card">
                <h2>Shadow Effect</h2>
                <button>Click Me</button>
                <p>Button gets a stronger shadow.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Transitions and Transformations</p>
    </footer>

</body>
</html>
