<!DOCTYPE html>
<html>

<head>
    <title>Box Model</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="demo">

        <div class="margin">

            <div class="border">

                <div class="padding">

                    <div class="content">
                        Content
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="text">

        <p>Content: Actual information inside the box.</p>
        <p>Padding: Space between content and border.</p>
        <p>Border: Line surrounding the padding.</p>
        <p>Margin: Space outside the border.</p>

    </div>


    <h2>Box Sizing Example</h2>

    <div class="size-box default">
        Default Box Sizing
    </div>

    <div class="size-box border-box">
        Border Box
    </div>

</body>

</html>
