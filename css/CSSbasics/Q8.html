<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="question8.css">
</head>

<body>

    <!-- Fixed Header -->
    <header>
        <h1>My Dashboard</h1>
    </header>


    <div class="dashboard">

        <!-- Sidebar -->
        <aside>

            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>

        </aside>


        <!-- Main Content -->
        <main>

            <h2>Welcome Back!</h2>

            <div class="boxes">

                <div class="box">
                    <h2>Projects</h2>
                    <p>12 Active Projects</p>
                </div>

                <div class="box">
                    <h2>Tasks</h2>
                    <p>25 Pending Tasks</p>
                </div>

                <div class="box">
                    <h2>Messages</h2>
                    <p>8 New Messages</p>
                </div>

                <div class="box">
                    <h2>Progress</h2>
                    <p>75% Completed</p>
                </div>

            </div>

        </main>

    </div>

</body>

</html>
