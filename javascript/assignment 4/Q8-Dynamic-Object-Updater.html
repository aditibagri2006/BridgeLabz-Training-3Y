<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; }
        input { display: block; width: 100%; padding: 9px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 18px; }
        pre { background: #f2f2f2; padding: 12px; }
    </style>
</head>
<body>
    <h1>Edit User Details</h1>
    <form id="userForm">
        <label>Name <input id="editName" type="text" required></label>
        <label>Email <input id="editEmail" type="email" required></label>
        <label>Age <input id="editAge" type="number" min="0" required></label>
        <button type="submit">Update User</button>
    </form>
    <h2>Updated Object</h2>
    <pre id="userDetails"></pre>
    <script src="Q8-Dynamic-Object-Updater.js"></script>
</body>
</html>
