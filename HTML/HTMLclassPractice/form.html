<!DOCTYPE html>
<html >
<head>
    
    <title>Student Registration Form</title>

</head>
<body>
    <h1 align="center"> Student Registration form</h1>
    <form>
        <table border="1" width="100%" cellpadding="10">
            <tr>
                <th colspan="2">Registration Form</th>
            </tr>
            <tr>
                <td><label for="name">Name</label></td>
                <td>
                    <input id="name" type="text" placeholder="Enter your name">
                </td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td>
                    <input id="email" type="email" placeholder="abc@gmail.com">
                </td>
            </tr>
            <tr>
                <td><label for="phone">Phone No.</label></td>
                <td>
                    <input id="phone" type="phone" placeholder="9876543210">
                </td>
            </tr>
            <tr>
                <td><label>Date of Birth</label></td>
                <td>
                    <input type="Date">
                </td>
            </tr>
            <tr>
                <td><label>Gender</label></td>
                <td>
                    <section>
                        <label>Male</label>
                        <input type="radio" name="gender">
                        <label>feMale</label>
                        <input type="radio" name="gender">
                        <label>other</label>
                    </section>
                </td>
            </tr>
            <tr>
                <td><label>Skills</label></td>
                <td>
                    <label for="HTML">HTML</label>
                    <input id="HTML" type="checkbox">
                    <label for="HTML">CSS</label>
                    <input id="CSS" type="checkbox">
                    <label for="JavaScript">JavaScript</label>
                    <input id="JavaScript" type="checkbox">
                </td>
            </tr>
            <tr>
                <td><label for="Courses">Courses</label></td>
                <td>
                    <select id="Courses" name="Courses">
                        <option>html</option>
                        <option>css</option>
                        <option>js</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><Label for="Address">Address</Label></td>
                <td><input id="Address" type="text"></td>
            </tr>
            <tr>
                <td><label for="resume">Upload Resume</label></td>
                <td><input id="resume" type="file" name="file"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit">Submit</button>
                    <button type="submit">Submit</button>
                </td>
            </tr>
            
        </table>
    </form>
    <iframe src="https://student.glauniversity.in/Main/Index" width="600" height="400"></iframe>
    
</body>
</html>
