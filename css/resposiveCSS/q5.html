<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filter Cards Animation</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="profiles">

            <div class="profile-card">
                <img class="grayscale"
                     src="https://i.pravatar.cc/300?img=1"
                     alt="Profile">
                <h2>Alex</h2>
                <p>Web Designer</p>
            </div>

            <div class="profile-card">
                <img class="sepia"
                     src="https://i.pravatar.cc/300?img=5"
                     alt="Profile">
                <h2>Emma</h2>
                <p>Developer</p>
            </div>

            <div class="profile-card">
                <img class="brightness"
                     src="https://i.pravatar.cc/300?img=9"
                     alt="Profile">
                <h2>John</h2>
                <p>UI Designer</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Animated Profile Cards</p>
    </footer>

</body>
</html>
