<!DOCTYPE html>
<html>

<head>
    <title>Travel Selection</title>
</head>

<body>

    <h1>Select Your Travel Details</h1>

    <label>Country:</label>

    <select>

        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>

    </select>

    <br><br>


    <label>State:</label>

    <select>

        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>

    </select>

    <br><br>


    <label>City:</label>

    <select>

        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>

    </select>

    <br><br>


    <label>Favorite Tourist Place:</label>

    <select>

        <option selected>Taj Mahal</option>
        <option>Goa</option>
        <option>Jaipur</option>
        <option>Manali</option>

    </select>


    <p>
        My choices are India, Uttar Pradesh, Mathura and
        Taj Mahal as my favorite tourist place.
    </p>

</body>

</html>
